# ~/.tmux.conf

# --- General ---
set -g mouse on                       # enable mouse: click panes, drag borders, scroll
set -g history-limit 50000            # more scrollback
set -sg escape-time 0                 # no delay after Esc (important for Neovim)
set -g default-terminal "screen-256color"
set -as terminal-features ',*:RGB'    # true color support
set -g status-position top            # status bar at top
set -g status-style bg=default        # transparent status bar background
set -g renumber-windows on            # renumber windows when one is closed
set -g base-index 1                   # start window numbering at 1, not 0
set -g pane-base-index 1              # same for panes

# --- Prefix key ---
# Keeping default Ctrl-b prefix (well-known, muscle memory from tutorials/docs)
# To change it instead, uncomment below:
# set -g prefix C-a
# unbind C-b
# bind C-a send-prefix

# --- Reload config ---
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# --- Splits (more intuitive than % and ") ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- New window opens in current path ---
bind c new-window -c "#{pane_current_path}"

# --- Pane navigation (vim-style) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# --- Pane resizing (vim-style, repeatable) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Window navigation ---
bind -n M-h previous-window           # Alt+h to go to previous window (no prefix needed)
bind -n M-l next-window               # Alt+l to go to next window (no prefix needed)

# --- Quick pane/window kill without confirmation ---
bind x kill-pane
bind X kill-window

# --- Copy mode using vim keys ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- Status bar (minimal, clean) ---
set -g status-left "#[bold] #S "
set -g status-right "#[fg=colour244] %H:%M "
set -g status-justify centre
setw -g window-status-current-format "#[bold]#I:#W#F"
setw -g window-status-format "#I:#W#F"
